openapi: 3.1.0
info:
  title: Event Ticketing API
  version: 1.0.0
  description: >-
    OpenAPI description of the SQLite-backed Build 5 API. Data persists across
    server restarts. The x-user-id header is a caller-supplied identity for
    this build, not an authenticated credential.
servers:
  - url: http://localhost:3000
tags:
  - name: Health
  - name: Events
  - name: Bookings
paths:
  /health:
    get:
      tags: [Health]
      summary: Check server health
      operationId: getHealth
      responses:
        '200':
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/events:
    get:
      tags: [Events]
      summary: Search published events
      description: >-
        Returns summaries for published events only. Date bounds are inclusive;
        a date-only `to` value includes that whole day. Text search checks title
        and venue, and city matching is case-insensitive. Results are sorted by
        date by default.
      operationId: searchEvents
      parameters:
        - name: q
          in: query
          description: Case-insensitive text matched against title and venue.
          schema:
            type: string
        - name: city
          in: query
          description: City name, matched case-insensitively.
          schema:
            type: string
        - name: from
          in: query
          description: Inclusive earliest event date or date-time.
          schema:
            type: string
          example: '2026-12-01'
        - name: to
          in: query
          description: Inclusive latest event date or date-time. A date-only value includes the full day.
          schema:
            type: string
          example: '2026-12-31'
        - name: maxPriceCents
          in: query
          description: Maximum cheapest-tier price, in whole cents.
          schema:
            type: integer
            minimum: 0
        - name: onlyAvailable
          in: query
          description: When true, exclude events with no seats left.
          schema:
            type: boolean
        - name: sort
          in: query
          description: Sort key. Defaults to date.
          schema:
            type: string
            enum: [date, price, availability]
            default: date
      responses:
        '200':
          description: Matching published event summaries, possibly an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'
        '400':
          description: Invalid search date, price, or sort value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Events]
      summary: Create a draft event
      operationId: createEvent
      security:
        - UserIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Event created as a draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid event data or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/events/{id}/tiers:
    post:
      tags: [Events]
      summary: Add a ticket tier to an event
      operationId: addEventTier
      security:
        - UserIdHeader: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TierCreate'
      responses:
        '201':
          description: Tier created with zero tickets sold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tier'
        '400':
          description: Invalid tier data or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/events/{id}/publish:
    post:
      tags: [Events]
      summary: Publish an event
      description: The caller must own the event, and it must have at least one tier.
      operationId: publishEvent
      security:
        - UserIdHeader: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The published event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Event cannot be published in its current state, such as having no tiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/events/{id}/unpublish:
    post:
      tags: [Events]
      summary: Unpublish an event
      description: >-
        The caller must own the event. Pending bookings are cancelled and paid
        bookings are marked refunded before the event returns to draft status.
      operationId: unpublishEvent
      security:
        - UserIdHeader: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The event in draft status after unpublishing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bookings:
    post:
      tags: [Bookings]
      summary: Create a pending booking
      description: >-
        Reserves tickets from a tier on a published event. Quantity must be
        between 1 and 10, and the total is stored in whole cents.
      operationId: createBooking
      security:
        - UserIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      responses:
        '201':
          description: Pending booking created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid booking data or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Event is not published or the tier does not have enough seats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bookings/{reference}/pay:
    post:
      tags: [Bookings]
      summary: Pay for a pending booking
      description: >-
        Only the attendee who created the booking can pay. Send `decline: true`
        to simulate a declined payment; the booking remains pending and can be
        retried. The mock gateway does not receive card details.
      operationId: payForBooking
      security:
        - UserIdHeader: []
      parameters:
        - $ref: '#/components/parameters/BookingReference'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Booking marked paid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Malformed JSON or invalid decline value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Payment declined or the booking cannot transition to paid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bookings/{reference}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel an unpaid booking
      description: Only the attendee who created a pending booking can cancel it. The reserved seats are released.
      operationId: cancelBooking
      security:
        - UserIdHeader: []
      parameters:
        - $ref: '#/components/parameters/BookingReference'
      responses:
        '200':
          description: Booking marked cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Booking is not pending and cannot be cancelled by this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    UserIdHeader:
      type: apiKey
      in: header
      name: x-user-id
      description: Caller-supplied user identifier used until authentication is added in Build 7.
  parameters:
    EventId:
      name: id
      in: path
      required: true
      description: Event identifier returned by the create-event endpoint.
      schema:
        type: string
    BookingReference:
      name: reference
      in: path
      required: true
      description: Booking reference returned when a booking is created.
      schema:
        type: string
  responses:
    Unauthenticated:
      description: Missing or empty x-user-id header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller is not the event organizer or booking owner.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Event, tier, or booking was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error. Stack traces are not returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION
                - INVALID_JSON
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - INVALID_STATE
                - INVALID_TRANSITION
                - PAYMENT_DECLINED
                - SOLD_OUT
                - INTERNAL_ERROR
            message:
              type: string
    EventCreate:
      type: object
      required: [title, city, startsAt]
      properties:
        title:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        venue:
          type: string
          description: Optional in the current implementation; defaults to an empty string.
        startsAt:
          type: string
          description: Date or date-time accepted by the server and normalized to an ISO date-time in the response.
          example: '2026-12-05T17:00:00Z'
    Event:
      type: object
      required: [id, organizerId, title, city, venue, startsAt, status]
      properties:
        id:
          type: string
        organizerId:
          type: string
          description: Value of the x-user-id header that created the event.
        title:
          type: string
        city:
          type: string
        venue:
          type: string
        startsAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, published]
    EventSummary:
      type: object
      required: [id, title, city, venue, startsAt, status, tierCount, minPriceCents, seatsLeft]
      properties:
        id:
          type: string
        title:
          type: string
        city:
          type: string
        venue:
          type: string
        startsAt:
          type: string
          format: date-time
        status:
          type: string
          const: published
        tierCount:
          type: integer
          minimum: 0
        minPriceCents:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
          description: Null when the event has no tiers.
        seatsLeft:
          type: integer
          minimum: 0
    TierCreate:
      type: object
      required: [name, priceCents, capacity]
      properties:
        name:
          type: string
          minLength: 1
        priceCents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Whole cents; decimal prices are not accepted.
        capacity:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    Tier:
      type: object
      required: [id, eventId, name, priceCents, capacity, sold]
      properties:
        id:
          type: string
        eventId:
          type: string
        name:
          type: string
        priceCents:
          type: integer
          minimum: 0
        capacity:
          type: integer
          minimum: 1
        sold:
          type: integer
          minimum: 0
    BookingCreate:
      type: object
      required: [tierId, quantity]
      properties:
        tierId:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 10
    PaymentRequest:
      type: object
      properties:
        decline:
          type: boolean
          default: false
          description: True simulates a declined payment. No card number is accepted.
    Booking:
      type: object
      required: [id, reference, userId, tierId, quantity, amountCents, status, createdAt]
      properties:
        id:
          type: string
        reference:
          type: string
        userId:
          type: string
        tierId:
          type: string
        quantity:
          type: integer
          minimum: 1
        amountCents:
          type: integer
          minimum: 0
          description: Total booking price in whole cents.
        status:
          type: string
          enum: [pending, paid, cancelled, refunded, checked_in]
        createdAt:
          type: string
          format: date-time
